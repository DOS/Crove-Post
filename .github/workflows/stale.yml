name: Close Inactive Issues & PRs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Run once a week on Sunday at 00:00 UTC

jobs:
  close-issues:
    if: github.repository == 'DOS/Crove-Post'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: "This issue has been automatically marked as stale because it has had no activity for 90 days. It will be closed in 14 days if no further activity occurs."
          close-issue-message: "This issue was automatically closed due to inactivity."
          exempt-issue-labels: "no-stale-bot,pinned,security,enhancement"

          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: "This PR has been automatically marked as stale because it has had no activity for 60 days. It will be closed in 14 days if no further activity occurs."
          close-pr-message: "This PR was automatically closed due to inactivity."
          exempt-pr-label: "no-stale-bot,pinned,work-in-progress"

          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 50
