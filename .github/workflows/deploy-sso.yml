name: Deploy Crove SSO Bridge

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/crove-sso/**'
      - '.github/workflows/deploy-sso.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - prod

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Install SSO Dependencies
        working-directory: apps/crove-sso
        run: pnpm install

      - name: Run Vitest Unit Tests
        working-directory: apps/crove-sso
        run: pnpm test

      - name: Determine Target Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers (Beta)
        if: steps.env.outputs.target == 'beta'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3368ff98a4c956164b7bbdc8fb950163' }}
          workingDirectory: 'apps/crove-sso'
          command: 'deploy -e beta'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers (Production)
        if: steps.env.outputs.target == 'prod'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '3368ff98a4c956164b7bbdc8fb950163' }}
          workingDirectory: 'apps/crove-sso'
          command: 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
