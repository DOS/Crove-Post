# ==============================================================================
# CROVE BETA DOCKER COMPOSE STACK (scripts/docker-compose.beta.yaml)
# Hosts: beta-post.crove.com (App)
# ==============================================================================

services:
  crove-post-beta:
    image: ghcr.io/dos/crove-post:beta
    container_name: crove-post-beta
    restart: always
    env_file:
      - crove-server.beta.env
    volumes:
      - crove-post-beta-config:/config/
      - crove-post-beta-uploads:/uploads/
    ports:
      - '127.0.0.1:5001:5000'
    networks:
      - crove-post-beta-network
      - postiz-network
      - temporal-network
    depends_on:
      crove-postgres-beta:
        condition: service_healthy
      crove-redis-beta:
        condition: service_healthy

  crove-postgres-beta:
    image: postgres:17-alpine
    container_name: crove-postgres-beta
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - crove-postgres-beta-volume:/var/lib/postgresql/data
    networks:
      - crove-post-beta-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  crove-redis-beta:
    image: redis:7.2
    container_name: crove-redis-beta
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - crove-redis-beta-data:/data
    networks:
      - crove-post-beta-network

volumes:
  crove-postgres-beta-volume:
    external: false
  crove-redis-beta-data:
    external: false
  crove-post-beta-config:
    external: false
  crove-post-beta-uploads:
    external: false

networks:
  crove-post-beta-network:
    external: false
  postiz-network:
    external: true
    name: crove_postiz-network
  temporal-network:
    external: true
    name: crove_temporal-network
