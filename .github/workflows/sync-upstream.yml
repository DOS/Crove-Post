name: "Sync Upstream Postiz"

on:
  schedule:
    - cron: "0 3 * * *" # Run daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Auto merge into main if no conflicts"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: "Fetch & Sync Upstream Releases"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: |
          git remote add upstream https://github.com/gitroomhq/postiz-app.git || true
          git fetch upstream main --tags

      - name: Sync and Create PR
        id: sync
        run: |
          BRANCH_NAME="upstream-sync-$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME" upstream/main || git checkout -b "$BRANCH_NAME"

          # Check if there are changes between main and upstream
          COMMITS_BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $COMMITS_BEHIND"

          if [ "$COMMITS_BEHIND" -gt 0 ]; then
            git merge upstream/main -m "chore(sync): automated sync with upstream main" --no-edit || {
              echo "Merge conflict detected. Please resolve manually."
              exit 1
            }
            git push -u origin "$BRANCH_NAME"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Already up-to-date with upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js & PNPM
        if: steps.sync.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup PNPM
        if: steps.sync.outputs.has_changes == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Run Branding Guard on Synced Code
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          pnpm dlx tsx scripts/branding-guard.ts

      - name: Create Pull Request
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: sync with upstream Postiz ($(date +%Y-%m-%d))" \
            --body "Automated synchronization with upstream \`gitroomhq/postiz-app\` main branch. Branding guard tests verified." \
            --head "${{ steps.sync.outputs.branch_name }}" \
            --base main
