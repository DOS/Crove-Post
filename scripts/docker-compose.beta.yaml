# ==============================================================================
# CROVE BETA DOCKER COMPOSE STACK (scripts/docker-compose.beta.yaml)
# Hosts: beta-post.crove.com (App)
# ==============================================================================

services:
  crove-post-beta:
    image: ${CROVE_POST_BETA_IMAGE:-ghcr.io/dos/crove-post:beta}
    container_name: crove-post-beta
    restart: always
    pull_policy: always
    # Schema changes are a separate reviewed operation. Never introspect/drop
    # dynamic Mastra tables or run db push --accept-data-loss at app startup.
    command: ["sh", "-c", "nginx && pnpm exec pm2 ping && pnpm run --parallel pm2 && pnpm exec pm2 logs"]
    env_file:
      - crove-server.beta.env
    environment:
      MASTRA_DISABLE_STORAGE_INIT: 'true'
    volumes:
      - postiz-beta-config:/config/
      - postiz-beta-uploads:/uploads/
    ports:
      - '127.0.0.1:5001:5000'
    networks:
      crove-post-beta-network:
      postiz-network:
        aliases:
          - crove-post-beta
          - postiz-beta
      temporal-network:
    depends_on:
      crove-redis-beta:
        condition: service_healthy

  crove-redis-beta:
    image: redis:7.2
    container_name: crove-redis-beta
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-beta-data:/data
    networks:
      - crove-post-beta-network

volumes:
  postiz-redis-beta-data:
    name: crove_postiz-redis-beta-data
  postiz-beta-config:
    name: crove_postiz-beta-config
  postiz-beta-uploads:
    name: crove_postiz-beta-uploads

networks:
  crove-post-beta-network:
    external: false
  postiz-network:
    external: true
    name: crove_postiz-network
  temporal-network:
    external: true
    name: crove_temporal-network
