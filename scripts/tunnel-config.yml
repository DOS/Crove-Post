tunnel: 41d183ca-1507-4092-a2e5-a5bd988282ee
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # 1. Crove CRM on crove.io (Clean Multi-tenant: app.crove.io, *.crove.io)
  - hostname: crove.io
    service: http://crm-server:3000
    originRequest:
      httpHostHeader: crove.io

  - hostname: "*.crove.io"
    service: http://crm-server:3000

  # Crove CRM on crm.crove.com (Fallback / Legacy)
  - hostname: crm.crove.com
    service: http://crm-server:3000
    originRequest:
      httpHostHeader: crm.crove.com

  - hostname: "*.crm.crove.com"
    service: http://crm-server:3000

  - hostname: beta-crm.crove.com
    service: http://crm-server:3000
    originRequest:
      httpHostHeader: crm.crove.com

  # 2. Production App Dashboard (Crove Post)
  - hostname: post.crove.com
    service: http://crove-post:5000
    originRequest:
      httpHostHeader: post.crove.com

  - hostname: app.crove.com
    service: http://crove-post:5000
    originRequest:
      httpHostHeader: post.crove.com

  # 3. Production Landing Page
  - hostname: crove.com
    service: http://crove-web:3000
    originRequest:
      httpHostHeader: crove.com

  - hostname: www.crove.com
    service: http://crove-web:3000
    originRequest:
      httpHostHeader: www.crove.com

  # 4. Beta App Dashboard (Crove Post Beta)
  - hostname: beta-post.crove.com
    service: http://crove-post-beta:5000
    originRequest:
      httpHostHeader: beta-post.crove.com

  - hostname: beta-app.crove.com
    service: http://crove-post-beta:5000
    originRequest:
      httpHostHeader: beta-post.crove.com

  # 5. Beta Landing Page
  - hostname: beta.crove.com
    service: http://crove-web-beta:3000
    originRequest:
      httpHostHeader: beta.crove.com

  # 6. Crove Cal (Cal.com)
  - hostname: cal.crove.com
    service: http://crove-cal:3000
    originRequest:
      httpHostHeader: cal.crove.com

  # 7. Crove Sign (Documenso)
  - hostname: sign.crove.com
    service: http://crove-sign:3000
    originRequest:
      httpHostHeader: sign.crove.com

  # 8. Crove Desk (AgentDesk)
  - hostname: desk.crove.com
    service: http://desk-server:8083
    originRequest:
      httpHostHeader: desk.crove.com

  - hostname: beta-desk.crove.com
    service: http://desk-server:8083
    originRequest:
      httpHostHeader: desk.crove.com

  - service: http_status:404
