# ==============================================================================
# CROVE PRODUCTION DOCKER COMPOSE STACK (scripts/docker-compose.prod.yaml)
# Hosts: post.crove.com (App), crove.com & www.crove.com (Landing Page)
# ==============================================================================

services:
  crove-post:
    image: ghcr.io/dos/crove-post:latest
    container_name: crove-post
    restart: always
    env_file:
      - crove-server.env
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '127.0.0.1:5000:5000'
    networks:
      postiz-network:
        aliases:
          - crove-post
          - postiz
      temporal-network:
    depends_on:
      crove-postgres:
        condition: service_healthy
      crove-redis:
        condition: service_healthy

  crove-web:
    image: ghcr.io/dos/crove-web:latest
    container_name: crove-web
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://post.crove.com
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - postiz-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: crove-cloudflared
    restart: always
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./tunnel:/etc/cloudflared:ro
    networks:
      - postiz-network
    depends_on:
      - crove-post

  crove-postgres:
    image: postgres:17-alpine
    container_name: crove-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postiz-password
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  crove-redis:
    image: redis:7.2
    container_name: crove-redis
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    ports:
      - '127.0.0.1:7233:7233'
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - ES_SCHEMA_SETUP=true
      - ES_VIS_INDEX=temporal-visibility
      - ES_SEC_VIS_INDEX=temporal-secondary-visibility
    networks:
      - temporal-network
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    depends_on:
      - temporal

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    networks:
      - temporal-network
    depends_on:
      - temporal

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_USER=temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: always
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - xpack.security.enabled=false
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network

volumes:
  postgres-volume:
    name: crove_postgres-volume
  postiz-redis-data:
    name: crove_postiz-redis-data
  postiz-config:
    name: crove_postiz-config
  postiz-uploads:
    name: crove_postiz-uploads
  temporal-postgres-data:
    name: crove_temporal-postgres-data
  temporal-elasticsearch-data:
    name: crove_temporal-elasticsearch-data
  crove-web-data:
    name: crove_crove-web-data

networks:
  postiz-network:
    name: crove_postiz-network
  temporal-network:
    name: crove_temporal-network
